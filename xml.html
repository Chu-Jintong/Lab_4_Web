<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore</title>
    <style>/*design the style of the html*/
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; margin-top: 16px; }
        td,th{ border: 1px solid #333; padding: 8px 20px; }
        th { background: #2d7d46; color: white; }
    </style>
</head>
<body>
    <h1>Bookstore</h1>python -m http.server 8000

    <table id="booktable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        fetch('book.xml')/*Use the fetch to load the xml file*/
            .then((response)=>{if (!response.ok) {throw new Error('Fetch error: ' + response.status);}
            return response.text();
        })
            .then((xmlText)=>{
                const parser=new DOMParser();
                const xmlDoc=parser.parseFromString(xmlText,'text/xml');
                const books=xmlDoc.getElementsByTagName('book');
                const tbody = document.querySelector('#booktable tbody');
                for (let i = 0; i < books.length; i++) 
                {
                    const id=books[i].getAttribute('id'); 
                    const title=books[i].getElementsByTagName('title')[0].textContent;
                    const author=books[i].getElementsByTagName('author')[0].textContent;
                    const price=books[i].getElementsByTagName('price')[0].textContent;
                    const row=document.createElement('tr');
                    row.innerHTML=`<td>${id}</td><td>${title}</td><td>${author}</td><td>$${price}</td>`;
                    tbody.appendChild(row);
                }
            })
            .catch((err)=>console.error('Fetch error: '+err.message));
    </script>
</body>
</html>
